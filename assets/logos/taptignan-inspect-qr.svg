<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="qrBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0080FF" />
      <stop offset="100%" stop-color="#0056C6" />
    </linearGradient>
    <linearGradient id="qrGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
  </defs>

  <!-- Top-Left QR Finder Pattern -->
  <g transform="translate(90, 85)">
    <rect x="0" y="0" width="64" height="64" rx="8" fill="none" stroke="url(#qrGreen)" stroke-width="12" />
    <rect x="18" y="18" width="28" height="28" rx="4" fill="url(#qrGreen)" />
  </g>

  <!-- Top-Right QR Finder Pattern -->
  <g transform="translate(358, 85)">
    <rect x="0" y="0" width="64" height="64" rx="8" fill="none" stroke="url(#qrGreen)" stroke-width="12" />
    <rect x="18" y="18" width="28" height="28" rx="4" fill="url(#qrGreen)" />
  </g>

  <!-- Shield Top Crest (Digital Chevron / QR Module) -->
  <path d="M 180 115 L 256 80 L 332 115"
        fill="none"
        stroke="url(#qrBlue)"
        stroke-width="18"
        stroke-linecap="round"
        stroke-linejoin="round" />
  <path d="M 210 148 L 256 128 L 302 148"
        fill="none"
        stroke="url(#qrBlue)"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Shield Sides & Bottom (Segmented QR Data Modules & Circuit Tracks) -->
  <!-- Left Side Segments -->
  <path d="M 122 175 L 122 245 L 155 245"
        fill="none"
        stroke="url(#qrBlue)"
        stroke-width="18"
        stroke-linecap="round"
        stroke-linejoin="round" />
  <path d="M 122 280 L 155 280 L 155 330 L 210 380"
        fill="none"
        stroke="url(#qrBlue)"
        stroke-width="18"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Right Side Segments -->
  <path d="M 390 175 L 390 245 L 357 245"
        fill="none"
        stroke="url(#qrBlue)"
        stroke-width="18"
        stroke-linecap="round"
        stroke-linejoin="round" />
  <path d="M 390 280 L 357 280 L 357 330 L 302 380"
        fill="none"
        stroke="url(#qrBlue)"
        stroke-width="18"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Shield Bottom Tip -->
  <path d="M 210 380 L 256 420 L 302 380"
        fill="none"
        stroke="url(#qrBlue)"
        stroke-width="20"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Center Inspection Eye Contours ("Tignan") -->
  <path d="M 150 256 C 185 190 327 190 362 256"
        fill="none"
        stroke="url(#qrBlue)"
        stroke-width="20"
        stroke-linecap="round" />
  <path d="M 150 256 C 185 322 327 322 362 256"
        fill="none"
        stroke="url(#qrBlue)"
        stroke-width="20"
        stroke-linecap="round" />

  <!-- Eye Pupil: QR Target Finder Pattern (Green) -->
  <g transform="translate(230, 230)">
    <rect x="0" y="0" width="52" height="52" rx="6" fill="none" stroke="url(#qrGreen)" stroke-width="10" />
    <rect x="15" y="15" width="22" height="22" rx="3" fill="url(#qrGreen)" />
  </g>
</svg>
